name: build-exe

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Test suites
        run: |
          python tools/ft_selftest.py
          python tools/test_handshake.py
          python tools/test_certs.py
          python tools/test_pose_math.py
          python tools/test_helmet.py
          python tools/test_state.py
          python tools/e2e_test.py

      - name: Web view host imports on Windows
        run: python -c "import webview, clr; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else 'ok')"

      - name: Real-tkinter smoke test
        # Windows runners have a desktop session, so the actual GUI can be
        # constructed here -- the only place a shadowed tkinter internal or a
        # bad widget option shows up before a tester's screen.
        run: |
          python -c "import tkinter as tk, server_windows as sw; app = sw.SimTrackApp(); app.update_data(12.0, -3.0, 1.5, 1); app._helmet._draw(); app.update(); app.destroy(); print('GUI constructed, drew a pose, closed cleanly')"

      - name: Build SimTrack.exe
        run: pyinstaller SimTrack.spec --noconfirm

      - name: Zip the folder
        run: Compress-Archive -Path dist/SimTrack -DestinationPath SimTrack-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SimTrack-windows
          path: SimTrack-windows.zip
