name: build-exe

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build SimTrack.exe
        run: pyinstaller SimTrack.spec --noconfirm

      - name: Zip the folder
        run: Compress-Archive -Path dist/SimTrack -DestinationPath SimTrack-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SimTrack-windows
          path: SimTrack-windows.zip
