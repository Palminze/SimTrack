<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SimTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 16px;
    }
    header { text-align: center; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: #666; font-size: 13px; margin-top: 2px; }

    #video-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 4/3;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #face-dot {
      position: absolute;
      top: 10px; right: 10px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #444;
      transition: background 0.2s;
    }
    #face-dot.on { background: #00ff88; box-shadow: 0 0 6px #00ff8888; }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: #888;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
    }
    .card-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.connected { background: #00ff88; }
    .dot.connecting { background: #f59e0b; }
    .dot.error { background: #ef4444; }
    #status-text { font-size: 14px; color: #aaa; }

    .values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .vbox {
      background: #1a1a1a;
      border-radius: 9px;
      padding: 10px 8px;
      text-align: center;
    }
    .vbox .vlabel { font-size: 10px; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .vbox .vnum { font-size: 22px; font-weight: 700; color: #00ff88; font-variant-numeric: tabular-nums; }

    .tip { font-size: 12px; color: #444; text-align: center; }
  </style>
</head>
<body>

<header>
  <h1>SimTrack</h1>
  <p class="subtitle">Webcam head tracking for sim racing</p>
</header>

<div id="video-wrap">
  <video id="video" playsinline autoplay muted></video>
  <div id="face-dot"></div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span id="loading-text">Starting camera...</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Status</div>
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status-text">Not connected</span>
  </div>
  <div class="values">
    <div class="vbox"><div class="vlabel">Yaw</div><div class="vnum" id="v-yaw">0.0</div></div>
    <div class="vbox"><div class="vlabel">Pitch</div><div class="vnum" id="v-pitch">0.0</div></div>
    <div class="vbox"><div class="vlabel">Roll</div><div class="vnum" id="v-roll">0.0</div></div>
  </div>
</div>

<p class="tip">Prop phone on monitor ledge facing you · auto-connects to PC</p>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video       = document.getElementById('video');
const faceDot     = document.getElementById('face-dot');
const overlay     = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const dot         = document.getElementById('dot');
const statusText  = document.getElementById('status-text');
const vYaw        = document.getElementById('v-yaw');
const vPitch      = document.getElementById('v-pitch');
const vRoll       = document.getElementById('v-roll');

let landmarker = null;
let ws         = null;
let connected  = false;
let lastTime   = -1;

// ── Camera ────────────────────────────────────────────────────────────────────
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
}

// ── MediaPipe ─────────────────────────────────────────────────────────────────
async function loadLandmarker() {
  loadingText.textContent = 'Loading face tracker…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFacialTransformationMatrixes: true,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

// ── Head pose from 4×4 column-major rotation matrix ──────────────────────────
// In camera space: Y-rotation = left/right turn, X-rotation = nod, Z-rotation = tilt
// Camera is front-facing (mirror), so yaw and pitch are negated to match natural direction.
function matrixToEuler(m) {
  const toD = 180 / Math.PI;
  const headTurn = Math.asin(-Math.max(-1, Math.min(1, m[2]))) * toD;  // Y rotation → yaw
  const headNod  = Math.atan2(m[6], m[10]) * toD;                       // X rotation → pitch
  const headTilt = Math.atan2(m[1], m[0])  * toD;                       // Z rotation → roll
  return {
    yaw:   -headTurn,   // negate: front camera mirrors left/right
    pitch: -headNod,    // negate: nod up → show sky (scene shifts down)
    roll:   headTilt
  };
}

// ── Detection loop ────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);

  if (!landmarker || video.readyState < 2) return;
  if (video.currentTime === lastTime) return;
  lastTime = video.currentTime;

  const result = landmarker.detectForVideo(video, performance.now());
  const matrices = result.facialTransformationMatrixes;

  if (matrices?.length > 0) {
    faceDot.classList.add('on');
    const { yaw, pitch, roll } = matrixToEuler(matrices[0].data);

    vYaw.textContent   = yaw.toFixed(1);
    vPitch.textContent = pitch.toFixed(1);
    vRoll.textContent  = roll.toFixed(1);

    if (connected && ws?.readyState === WebSocket.OPEN) {
      ws.send(`{"yaw":${yaw.toFixed(2)},"pitch":${pitch.toFixed(2)},"roll":${roll.toFixed(2)}}`);
    }
  } else {
    faceDot.classList.remove('on');
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  dot.className = 'dot ' + state;
  statusText.textContent = text;
}

function connect() {
  setStatus('connecting', 'Connecting…');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    connected = true;
    setStatus('connected', 'Connected — tracking active');
  };
  ws.onclose = () => {
    connected = false;
    setStatus('', 'Disconnected — retrying…');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {
    setStatus('error', 'Connection failed');
  };
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    await startCamera();
    await loadLandmarker();
    overlay.style.display = 'none';
    connect();
    requestAnimationFrame(loop);
  } catch (e) {
    loadingText.textContent = e.message ?? 'Error — check camera permission';
    console.error(e);
  }
})();
</script>
</body>
</html>
